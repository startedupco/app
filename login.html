<script>
    var _loginHandling = false;
    var emailInput = '';
    // Staff consoles live on Helpdesk Central - they are not part of this bundle.
    var STAFF_CONSOLE = 'https://console.helpdeskcentral.co.za';
    function staffGo(role) {
        return false;
    }
    function togglePw(btn) { var input = document.getElementById(btn.getAttribute('data-target')); var show = input.type === 'password'; input.type = show ? 'text' : 'password'; btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); btn.style.opacity = show ? '1' : '0.55'; }
    function postLoginGo(profile) {
        profile = profile || {};
        var email = (profile.email || (getSession() && getSession().email) || '').toString().toLowerCase();
        var emailPrefix = email.indexOf('@') > -1 ? email.split('@')[0] : '';
        var name = (profile.name || '').toString().trim();
        var surname = (profile.surname || '').toString().trim();
        // Treat as incomplete if missing required personal info, or if name is just the
        // email username with no surname (the "only email+username" stub case).
        var done = !!(name && surname && profile.idNumber && profile.dob && profile.gender && profile.school && profile.currentStatus && profile.marks && profile.marks.length);
        if (done && emailPrefix && name.toLowerCase() === emailPrefix && !surname) { done = false; }
        var role = String((profile && profile.role) || 'applicant').trim().toLowerCase();
        // Staff run the console, not the applicant wizard - they go straight in.
        var isStaff = ['admin', 'director', 'agent', 'senior_agent', 'staff'].indexOf(role) !== -1;
        window.location.replace((done || isStaff) ? 'portal.html' : 'onboarding.html');
    }
    auth.onAuthStateChanged(function(user) {
        if (user && !_loginHandling) {
            var uid = user.id || user.uid;
            db.collection('users').doc(uid).get().then(function(doc) {
                var profile = doc.exists ? doc.data() : {};
                var role = (profile.role || 'applicant').trim();
                try { saveSession({ role: role, email: user.email, uid: uid }); } catch(e) {}
                if (staffGo(role)) return;
                postLoginGo(profile);
            }).catch(function() {
                var session = getSession();
                var sRole = session ? (session.role || 'applicant').trim() : 'applicant';
                if (staffGo(sRole)) return;
                postLoginGo(null);
            });
        }
    });

    function handleLogin() {
        var email = document.getElementById('loginEmail').value.trim();
        emailInput = email;
        var password = document.getElementById('loginPassword').value;
        var errorEl = document.getElementById('login-error');
        if (!email || !password) { errorEl.textContent = 'Enter your email and password.'; errorEl.style.display = 'block'; return; }
        if (typeof auth === 'undefined' || !auth) { errorEl.textContent = 'Please wait a moment while connection initializes.'; errorEl.style.display = 'block'; return; }
        _loginHandling = true;
        var btn = document.getElementById('login-submit-btn');
        btn.disabled = true; btn.textContent = 'Signing in...'; btn.classList.add('btn-shimmer');
        function resetBtn() { _loginHandling = false; btn.disabled = false; btn.textContent = 'Sign in'; btn.classList.remove('btn-shimmer'); }
        var loginTimeout = setTimeout(function() { resetBtn(); errorEl.textContent = 'Timed out. Try again.'; errorEl.style.display = 'block'; }, 15000);
        function authSignIn(email, password) {
            return new Promise(function(resolve, reject) {
                var done = false;
                auth.signInWithEmailAndPassword(email, password)
                    .then(function(r) { if (!done) { done = true; resolve(r); } })
                    .catch(function(e) { if (!done) { done = true; reject(e); } });
                setTimeout(function() { if (!done) { done = true; reject(new Error('Timed out')); } }, 12000);
            });
        }
        authSignIn(email, password)
            .then(function(result) {
                clearTimeout(loginTimeout);
                var user = result.user;
                var role = (user.role || 'applicant').trim();
                var uid = user.id || user.uid;
                try { saveSession({ role: role, email: email, uid: uid }); } catch(e) {}
                if (typeof logAuth === 'function') logAuth('login_success', { email: email, role: role }, { userId: uid });
                // Single source of truth for the post-login redirect: complete
                // profile (or staff) -> portal, anything else -> onboarding.
                db.collection('users').doc(uid).get().then(function(doc) {
                    postLoginGo(doc.exists ? doc.data() : {});
                }).catch(function() {
                    postLoginGo(null);
                });
            })
            .catch(function(error) {
                clearTimeout(loginTimeout); resetBtn();
                if (typeof logAuth === 'function') logAuth('login_failed', { email: email, error: error.message }, { severity: 'warning' });
                var msg = 'Login failed. Try again.';
                var errMsg = (error.message || '').toLowerCase();
                if (errMsg.includes('invalid login credentials') || errMsg.includes('invalid-credential') || errMsg.includes('wrong-password')) msg = 'Incorrect email or password.';
                else if (errMsg.includes('user-not-found') || errMsg.includes('not found')) msg = 'No account found with this email.';
                else if (errMsg.includes('too-many-requests')) msg = 'Too many attempts. Try later.';
                else if (errMsg.includes('network') || errMsg.includes('fetch')) msg = 'Network error. Check connection.';
                errorEl.textContent = msg; errorEl.style.display = 'block';
            });
    }
    document.getElementById('loginForm').addEventListener('submit', function(e) { e.preventDefault(); handleLogin(); });
    function signInWithGoogle() {
        var btn = document.getElementById('google-signin-btn');
        btn.disabled = true; btn.textContent = 'Connecting to Google...'; btn.classList.add('btn-shimmer');
        // Stay on this origin when it can receive the OAuth callback; file://
        // cannot, so fall back to the deployed site.
        var siteUrl = /^https?:$/.test(location.protocol) ? location.origin : 'https://app.collanduni.co.za';
        supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: siteUrl + '/onboarding.html' }
        }).catch(function(e) {
            btn.disabled = false; btn.classList.remove('btn-shimmer'); btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Google';
            document.getElementById('login-error').textContent = 'Google sign-in failed. Try again.'; document.getElementById('login-error').style.display = 'block';
        });
    }
</script>

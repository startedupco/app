    <style>
        .lx-screen{max-width:720px;margin:0 auto;padding:28px 20px 48px;background:#fff;color:#17191c;min-height:100vh}
        .lx-title{font-family:Comfortaa,-apple-system,'Segoe UI',sans-serif;font-weight: 700;font-size:clamp(1.5rem,5vw,2rem);letter-spacing:-.01em;line-height:1.15;margin:8px 0}
        .lx-sub{color:#62676d;font-size:1rem;line-height:1.5;margin-bottom:16px}
        .lx-sub strong{color:#17191c;font-weight:700}
        .lx-field{margin-bottom:16px}
        .lx-label{display:block;font-size:.875rem;font-weight:600;color:#17191c;margin-bottom:8px}
        .lx-input{width:100%;background:#f4f5f7;border:2px solid transparent;border-radius:14px;padding:14px 20px;font-size:1rem;color:#17191c;outline:none;font-family:inherit;min-height:48px}
        .lx-input::placeholder{color:#9aa1a7}
        .lx-input:focus{background:#fff;border-color:#3b6cf6}
        .lx-pw{position:relative}
        .lx-pw .lx-input{padding-right:52px}
        .lx-pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#62676d;cursor:pointer;padding:8px}
        .lx-pw button svg{width:20px;height:20px;display:block}
        .lx-shell{padding-bottom:4px}
        .lx-commit{width:100%;background:#ffd60a;color:#201900;border:0;border-radius:14px;padding:14px 24px;font-family:Comfortaa,sans-serif;font-weight: 700;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #e6b800;display:block;text-align:center;text-decoration:none;min-height:48px}
        .lx-commit:active{transform:translateY(4px);box-shadow:none}
        .lx-commit:disabled{opacity:.6}
        .lx-err{background:#fdecec;color:#e5484d;font-size:.9375rem;padding:12px 16px;border-radius:12px;margin-bottom:16px;display:none}
        .lx-ok{background:#e2f6ee;color:#009f70;font-size:.9375rem;padding:12px 16px;border-radius:12px;margin-bottom:16px;display:none}
        .lx-foot{text-align:center;margin-top:24px;font-size:.8125rem;color:#62676d}
        .lx-foot a{color:#3b6cf6;font-weight:600;text-decoration:none}
        .lx-title-row{display:flex;align-items:center;gap:10px;margin:8px 0}
        .lx-title-row>.lx-title{margin:0}
        .lx-back{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:50%;color:#17191c;cursor:pointer;padding:0;margin:0 0 0 -10px;font-family:Comfortaa,-apple-system,'Segoe UI',sans-serif}
        .lx-back:hover{background:transparent}
        .lx-back svg{width:24px;height:24px;display:block}
    </style>

<body>


<div class="lx-screen">
    <div id="loadingState">
        <div class="lx-title-row">
            <button type="button" class="lx-back" aria-label="Go back" onclick="if(window.history.length>1){window.history.back();}else{window.location.href='login.html';}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <p class="lx-title">Verifying...</p>
        </div>
        <p class="lx-sub"><strong>Checking your reset link.</strong></p>
    </div>

    <div id="resetForm" style="display:none;">
        <div class="lx-title-row">
            <button type="button" class="lx-back" aria-label="Go back" onclick="if(window.history.length>1){window.history.back();}else{window.location.href='login.html';}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1 class="lx-title">Set new password</h1>
        </div>
        <p class="lx-sub"><strong>Choose something strong</strong> 6+ characters.</p>

        <form id="newPasswordForm" onsubmit="return false;">
            <div class="lx-field">
                <label class="lx-label" for="newPassword">New Password</label>
                <div class="lx-pw">
                    <input class="lx-input" type="password" id="newPassword" placeholder="New password" required autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
                    <button type="button" data-target="newPassword" aria-label="Show password" onclick="togglePw(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="lx-field">
                <label class="lx-label" for="confirmPassword">Confirm Password</label>
                <div class="lx-pw">
                    <input class="lx-input" type="password" id="confirmPassword" placeholder="Repeat it" required autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
                    <button type="button" data-target="confirmPassword" aria-label="Show password" onclick="togglePw(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <p id="reset-error" class="lx-err"></p>
            <p id="reset-success" class="lx-ok"></p>
            <div class="lx-shell"><button type="submit" id="reset-submit-btn" class="lx-commit">Set Password</button></div>
        </form>
    </div>

    <div id="errorState" style="display:none;">
        <p class="lx-title">Link expired</p>
        <p class="lx-sub"><strong>That reset link no longer works</strong> request a fresh one.</p>
        <div class="lx-shell"><a href="forgot-password.html" class="lx-commit">Request new link</a></div>
    </div>

    <div id="successState" style="display:none;">
        <p class="lx-title">Password updated</p>
        <p class="lx-sub"><strong>You're good to go.</strong></p>
        <div class="lx-shell"><a href="login.html" class="lx-commit">Sign in</a></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        function togglePw(btn) { var input = document.getElementById(btn.getAttribute('data-target')); var show = input.type === 'password'; input.type = show ? 'text' : 'password'; btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); btn.style.opacity = show ? '1' : '0.55'; }
        window.togglePw = togglePw;
        // Capture URL tokens BEFORE supabase-js auto-detection strips them from the address bar
        var rawHash = window.location.hash || '';
        var rawSearch = window.location.search || '';

        if (!window.supabase || !window.supabase.createClient) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            return;
        }
        var sb = window.supabase.createClient('https://dcuphubxkycrreyitnyq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjdXBodWJ4a3ljcnJleWl0bnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NzUzOTgsImV4cCI6MjEwMTU1MTM5OH0.nPwH9SWGGvfl4CXofLS4yMNxHuFogjpf0MvcDcNUQdg');

        var loadingEl = document.getElementById('loadingState');
        var resetFormEl = document.getElementById('resetForm');
        var errorEl = document.getElementById('errorState');
        var successEl = document.getElementById('successState');

        function showForm() { loadingEl.style.display = 'none'; resetFormEl.style.display = 'block'; }
        function showError() { loadingEl.style.display = 'none'; errorEl.style.display = 'block'; }

        function establishRecoverySession() {
            var hashParams = new URLSearchParams(rawHash.charAt(0) === '#' ? rawHash.substring(1) : rawHash);
            var queryParams = new URLSearchParams(rawSearch);

            // 1) PKCE flow: ?code=...
            var code = queryParams.get('code');
            if (code) {
                return sb.auth.exchangeCodeForSession(code);
            }

            // 2) Implicit flow (Supabase default): #access_token=...&refresh_token=...
            var accessToken = hashParams.get('access_token');
            var refreshToken = hashParams.get('refresh_token');
            if (accessToken && refreshToken) {
                return sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
            }

            // 3) Email OTP template: token_hash in hash or query
            var tokenHash = hashParams.get('token_hash') || queryParams.get('token_hash');
            if (tokenHash) {
                return sb.auth.verifyOtp({ type: 'recovery', token_hash: tokenHash });
            }

            // 4) Legacy ?token=&type=recovery style
            var legacyType = queryParams.get('type') || hashParams.get('type');
            var legacyToken = queryParams.get('token') || hashParams.get('token');
            if (legacyToken && legacyType === 'recovery') {
                return sb.auth.verifyOtp({ token: legacyToken, type: 'recovery' });
            }

            // 5) Fall back to any session supabase-js already recovered from the URL
            return sb.auth.getSession().then(function(res) {
                if (!res.data || !res.data.session) {
                    throw new Error('No recovery token found in link.');
                }
                return { error: null };
            });
        }

        establishRecoverySession().then(function(result) {
            if (result && result.error) {
                console.error('Verify error:', result.error);
                showError();
            } else {
                showForm();
            }
        }).catch(function(err) {
            console.error('Verify error:', err);
            showError();
        });

        // Handle password form submission
        document.getElementById('newPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;
            var errEl = document.getElementById('reset-error');
            var sucEl = document.getElementById('reset-success');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';

            if (!newPwd || !confirmPwd) {
                errEl.textContent = 'Please fill in both fields.';
                errEl.style.display = 'block';
                return;
            }
            if (newPwd.length < 6) {
                errEl.textContent = 'Password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                errEl.textContent = 'Passwords do not match.';
                errEl.style.display = 'block';
                return;
            }

            var btn = document.getElementById('reset-submit-btn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            sb.auth.updateUser({ password: newPwd }).then(function(result) {
                if (result.error) {
                    btn.disabled = false;
                    btn.textContent = 'Set Password';
                    errEl.textContent = result.error.message || 'Failed to update password.';
                    errEl.style.display = 'block';
                } else {
                    resetFormEl.style.display = 'none';
                    successEl.style.display = 'block';
                }
            }).catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Set Password';
                errEl.textContent = err.message || 'Failed to update password.';
                errEl.style.display = 'block';
            });
        });
    })();
</script>
